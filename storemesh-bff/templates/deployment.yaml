apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storemesh-bff.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "storemesh-bff.name" . }}
    app.kubernetes.io/part-of: storemesh
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "storemesh-bff.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "storemesh-bff.name" . }}
        app.kubernetes.io/part-of: storemesh
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PRODUCT_SERVICE_ADDR
              value: {{ .Values.config.productServiceAddr | quote }}
            - name: ORDER_SERVICE_ADDR
              value: {{ .Values.config.orderServiceAddr | quote }}
            - name: USER_SERVICE_ADDR
              value: {{ .Values.config.userServiceAddr | quote }}
            - name: CORS_ALLOWED_ORIGIN
              value: {{ .Values.config.corsAllowedOrigin | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources: {{- toYaml .Values.resources | nindent 12 }}
