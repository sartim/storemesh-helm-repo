name: Release

on:
  workflow_dispatch:
    inputs:
      republish_version:
        description: Existing semantic version to republish after a registry upload failure (for example 0.28.0)
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Semantic chart release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Run semantic release
        id: semantic-release
        if: github.event_name != 'workflow_dispatch' || inputs.republish_version == ''
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-file: CHANGELOG.md
          update-file: VERSION
          allow-initial-development-versions: true

      - name: Detect release tag
        id: release
        env:
          REPUBLISH_VERSION: ${{ inputs.republish_version }}
          RELEASE_VERSION: ${{ steps.semantic-release.outputs.version }}
        run: |
          git fetch --force --tags origin
          version="$REPUBLISH_VERSION"
          if [ -z "$version" ]; then
            version="$RELEASE_VERSION"
          fi
          if [ -z "$version" ]; then
            echo "No new semantic release to publish. Set republish_version only to recover an existing release."
            exit 0
          fi
          case "$version" in
            *[!0-9.]*|.*|*..*|*.) echo "Invalid semantic version: $version" >&2; exit 1 ;;
          esac
          tag="v$version"
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null || {
            echo "Release tag $tag does not exist; refusing to publish an untagged version." >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GitHub Container Registry
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish OCI chart
        if: steps.release.outputs.tag != ''
        env:
          CHART_VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/chart-package.sh
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          helm push "dist/storemesh-user-service-${CHART_VERSION}.tgz" \
            oci://ghcr.io/sartim/charts
