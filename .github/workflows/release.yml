name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Semantic chart release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Run semantic release
        id: semantic-release
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-file: CHANGELOG.md
          update-file: VERSION
          allow-initial-development-versions: true

      - name: Detect release tag
        id: release
        run: |
          git fetch --force --tags origin
          tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -n "$tag" ] && [ "${{ steps.semantic-release.outputs.version }}" != "" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GitHub Container Registry
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish OCI chart
        if: steps.release.outputs.tag != ''
        env:
          CHART_VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/chart-package.sh
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          helm push "dist/storemesh-user-service-${CHART_VERSION}.tgz" \
            oci://ghcr.io/sartim/charts
