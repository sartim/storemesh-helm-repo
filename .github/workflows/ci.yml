name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: Validate chart
        run: scripts/helm-validate.sh

      - name: Validate Keycloak platform role contract
        run: python3 scripts/validate-keycloak-oidc.py

      - name: Smoke test Keycloak realm import and OIDC discovery
        run: scripts/smoke-keycloak-runtime.sh

      - name: Package chart
        run: scripts/chart-package.sh
