replicaCount: 2
pdb:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  allowedIngressNamespaces:
    - storemesh-bff
    - storemesh-staging-bff
prometheusRule:
  enabled: false
  additionalLabels: {}
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}
image:
  repository: ghcr.io/sartim/storemesh-order-service
  tag: "0.2.2"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 50051
secrets:
  existingSecret: storemesh-order-service-secrets
externalSecrets:
  enabled: false
  secretStoreRef: {name: "", kind: ClusterSecretStore}
  remoteKey: ""
  targetName: ""
dependencies:
  productAddress: storemesh-product-service.storemesh-product-service.svc.cluster.local:50051
  inventoryAddress: storemesh-inventory-service.storemesh-inventory-service.svc.cluster.local:50051
kafka:
  # This only runs the publisher; it does not install Kafka or Confluent for Kubernetes.
  enabled: false
  brokers: ""
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 128Mi}
