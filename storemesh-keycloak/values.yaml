replicaCount: 1
image:
  repository: quay.io/keycloak/keycloak
  tag: "26.4.2"
  pullPolicy: IfNotPresent
service:
  port: 8080
admin:
  username: admin
  existingSecret: storemesh-keycloak-admin
  passwordKey: password
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 1Gi }
networkPolicy:
  enabled: false
realm:
  enabled: true
  name: storemesh
  clients:
    grafana:
      redirectUris:
        - http://localhost:3001/login/generic_oauth
    kiali:
      redirectUris:
        - https://localhost:20001/kiali
    kibana:
      redirectUris:
        - https://localhost:5601/api/security/oidc/callback
    argocd:
      redirectUris:
        - https://localhost:8443/auth/callback
