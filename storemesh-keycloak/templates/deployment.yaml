apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storemesh-keycloak.fullname" . }}
  labels: { app.kubernetes.io/name: {{ include "storemesh-keycloak.name" . }}, app.kubernetes.io/part-of: storemesh }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "storemesh-keycloak.name" . }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "storemesh-keycloak.name" . }}, app.kubernetes.io/part-of: storemesh }
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start-dev", "--http-port=8080"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.admin.username | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.admin.existingSecret }}, key: {{ .Values.admin.passwordKey }} }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 30, periodSeconds: 15 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
