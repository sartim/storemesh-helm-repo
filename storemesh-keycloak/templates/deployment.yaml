apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storemesh-keycloak.fullname" . }}
  labels: { app.kubernetes.io/name: {{ include "storemesh-keycloak.name" . }}, app.kubernetes.io/part-of: storemesh }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "storemesh-keycloak.name" . }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "storemesh-keycloak.name" . }}, app.kubernetes.io/part-of: storemesh }
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["start-dev", "--http-port=8080", "--import-realm", "--health-enabled=true"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.admin.username | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.admin.existingSecret }}, key: {{ .Values.admin.passwordKey }} }
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: realm-import
          configMap:
            name: {{ include "storemesh-keycloak.fullname" . }}-realm
