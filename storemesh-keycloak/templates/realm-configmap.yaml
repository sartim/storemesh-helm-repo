{{- if .Values.realm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "storemesh-keycloak.fullname" . }}-realm
data:
  storemesh-realm.json: |
    {
      "realm": "{{ .Values.realm.name }}",
      "enabled": true,
      "registrationAllowed": false,
      "sslRequired": "none",
      "roles": { "realm": [
        { "name": "customer", "description": "StoreMesh customer" },
        { "name": "admin", "description": "StoreMesh administrator" },
        { "name": "operator", "description": "Platform operator" },
        { "name": "observability-admin", "description": "Observability administrator" }
      ]},
      "clients": [
        { "clientId": "storemesh-web", "name": "StoreMesh Web", "publicClient": true, "standardFlowEnabled": true, "directAccessGrantsEnabled": false, "redirectUris": ["http://localhost:3000/*"], "webOrigins": ["http://localhost:3000"], "protocolMappers": [{ "name": "storemesh-bff-audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": { "included.client.audience": "storemesh-bff", "access.token.claim": "true", "id.token.claim": "false" } }] },
        { "clientId": "storemesh-android", "name": "StoreMesh Android", "publicClient": true, "standardFlowEnabled": true, "directAccessGrantsEnabled": false, "redirectUris": ["com.storemesh.android://oauth/callback"], "protocolMappers": [{ "name": "storemesh-bff-audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": { "included.client.audience": "storemesh-bff", "access.token.claim": "true", "id.token.claim": "false" } }] },
        { "clientId": "storemesh-ios", "name": "StoreMesh iOS", "publicClient": true, "standardFlowEnabled": true, "directAccessGrantsEnabled": false, "redirectUris": ["storemesh-ios://oauth/callback"], "protocolMappers": [{ "name": "storemesh-bff-audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": { "included.client.audience": "storemesh-bff", "access.token.claim": "true", "id.token.claim": "false" } }] },
        { "clientId": "grafana", "publicClient": false, "standardFlowEnabled": true, "redirectUris": ["http://localhost:3001/login/generic_oauth"], "protocolMappers": [{ "name": "realm-roles-as-groups", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-realm-role-mapper", "config": { "claim.name": "groups", "jsonType.label": "String", "multivalued": "true", "access.token.claim": "true", "id.token.claim": "true", "userinfo.token.claim": "true" } }] },
        { "clientId": "kiali", "publicClient": false, "standardFlowEnabled": true, "redirectUris": ["http://localhost:20001/*"], "protocolMappers": [{ "name": "realm-roles-as-groups", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-realm-role-mapper", "config": { "claim.name": "groups", "jsonType.label": "String", "multivalued": "true", "access.token.claim": "true", "id.token.claim": "true", "userinfo.token.claim": "true" } }] },
        { "clientId": "kibana", "publicClient": false, "standardFlowEnabled": true, "redirectUris": ["http://localhost:5601/*"], "protocolMappers": [{ "name": "realm-roles-as-groups", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-realm-role-mapper", "config": { "claim.name": "groups", "jsonType.label": "String", "multivalued": "true", "access.token.claim": "true", "id.token.claim": "true", "userinfo.token.claim": "true" } }] },
        { "clientId": "argocd", "publicClient": false, "standardFlowEnabled": true, "redirectUris": ["https://localhost:8443/auth/callback"], "protocolMappers": [{ "name": "realm-roles-as-groups", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-realm-role-mapper", "config": { "claim.name": "groups", "jsonType.label": "String", "multivalued": "true", "access.token.claim": "true", "id.token.claim": "true", "userinfo.token.claim": "true" } }] }
      ]
    }
{{- end }}
