{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "storemesh-user-service.secretName" . }}
  labels:
    {{- include "storemesh-user-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.data.DATABASE_URL is required when secrets.create is true" .Values.secrets.data.DATABASE_URL | quote }}
  REDIS_URL: {{ required "secrets.data.REDIS_URL is required when secrets.create is true" .Values.secrets.data.REDIS_URL | quote }}
  JWT_SECRET: {{ required "secrets.data.JWT_SECRET is required when secrets.create is true" .Values.secrets.data.JWT_SECRET | quote }}
  {{- if .Values.secrets.data.DEMO_CUSTOMER_EMAIL }}
  DEMO_CUSTOMER_EMAIL: {{ .Values.secrets.data.DEMO_CUSTOMER_EMAIL | quote }}
  DEMO_CUSTOMER_PASSWORD: {{ .Values.secrets.data.DEMO_CUSTOMER_PASSWORD | quote }}
  DEMO_ADMIN_EMAIL: {{ .Values.secrets.data.DEMO_ADMIN_EMAIL | quote }}
  DEMO_ADMIN_PASSWORD: {{ .Values.secrets.data.DEMO_ADMIN_PASSWORD | quote }}
  {{- end }}
{{- end }}
