replicaCount: 2

image:
  repository: ghcr.io/sartim/storemesh-user-service
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 50051

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: api.storemesh.example.com
  tls:
    enabled: true
    secretName: storemesh-user-service-tls

environment: production

config:
  grpcPort: "50051"
  httpPort: "8080"
  jwtIssuer: storemesh-user-service
  jwtAudience: storemesh-platform
  jwtAccessTTL: 30m
  jwtRefreshTTL: 168h
  dbMaxOpenConns: "25"
  dbMaxIdleConns: "5"
  dbConnMaxLifetime: 5m
  otlpEndpoint: ""
  serviceName: storemesh-user-service
  serviceVersion: "0.1.0"

secrets:
  existingSecret: ""
  create: false
  data:
    DATABASE_URL: ""
    REDIS_URL: ""
    JWT_SECRET: ""
externalSecrets:
  enabled: false
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  remoteKey: ""
  targetName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    enabled: true
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress: []
  egress: []

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

prometheusRule:
  enabled: false
  additionalLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
