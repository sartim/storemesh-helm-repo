apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storemesh-frontend.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "storemesh-frontend.name" . }}
    app.kubernetes.io/part-of: storemesh
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "storemesh-frontend.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "storemesh-frontend.name" . }}
        app.kubernetes.io/part-of: storemesh
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          startupProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
