apiVersion: v1
kind: Service
metadata:
  name: {{ include "storemesh-product-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "storemesh-product-service.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "storemesh-product-service.name" . }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
