apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storemesh-product-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "storemesh-product-service.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "storemesh-product-service.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "storemesh-product-service.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: product-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: JWT_SECRET
            - name: JWT_ISSUER
              value: {{ .Values.config.jwtIssuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.config.jwtAudience | quote }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
