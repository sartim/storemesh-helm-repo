apiVersion: apps/v1
kind: Deployment
metadata:
  name: storemesh-inventory-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: storemesh-inventory-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: storemesh-inventory-service}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: inventory-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: http, containerPort: 8080}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: DATABASE_URL}}
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.config.keycloakIssuer | quote }}
            - name: KEYCLOAK_AUDIENCE
              value: {{ .Values.config.keycloakAudience | quote }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storemesh-inventory-service-outbox-publisher
  labels:
    app.kubernetes.io/name: storemesh-inventory-service-outbox-publisher
    app.kubernetes.io/component: outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storemesh-inventory-service-outbox-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storemesh-inventory-service-outbox-publisher
        app.kubernetes.io/component: outbox-publisher
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: outbox-publisher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/storemesh-inventory-publisher"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secrets.existingSecret }}, key: DATABASE_URL}}
            - name: KAFKA_BROKERS
              value: {{ required "kafka.brokers is required when kafka.enabled is true" .Values.kafka.brokers | quote }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
